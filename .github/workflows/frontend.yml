name: Frontend checks

on:
  pull_request:
    paths:
      - "healthmith-frontend/**"
      - "healthmith-backend/**"
      - "supabase/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main, "codex/**"]
    paths:
      - "healthmith-frontend/**"
      - "healthmith-backend/**"
      - "supabase/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: healthmith-frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: healthmith-frontend/.node-version
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Production build
        run: pnpm build
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser smoke tests
        run: pnpm test:e2e
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            healthmith-backend/*.gradle
            healthmith-backend/gradle/wrapper/gradle-wrapper.properties
      - name: Build real backend for workout browser tests
        run: ../healthmith-backend/gradlew -p ../healthmith-backend bootJar --no-daemon --console=plain
      - name: Workout browser integration with isolated PostgreSQL
        run: pnpm test:workout
      - name: Save browser test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-browser-reports
          path: |
            healthmith-frontend/playwright-report/
            healthmith-frontend/test-results/
          retention-days: 7
