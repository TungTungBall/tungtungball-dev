spring.application.name=healthmith-backend

# Supabase Data API 연결 (docs/CODE-STYLE.md 6번)
# 값은 환경변수로만 넣는다. 비어 있어도 서버와 테스트는 뜨며, Supabase 호출만 실패한다.
supabase.url=${SUPABASE_URL:}
supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:}
supabase.response-timeout=5s

# JSON 이름과 엄격한 읽기 (docs/CODE-STYLE.md 1번, docs/API.md 입력 검사)
# API·DB 키는 snake_case다. Java record 필드는 camelCase로 쓰고 @JsonProperty를 붙이지 않는다.
spring.jackson.property-naming-strategy=SNAKE_CASE
# 정의하지 않은 필드, 누락된 필드, 타입 자동 변환("5"→5, 5.5→5, true→1)을 오류로 처리한다.
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-missing-creator-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false

# 브라우저 직접 호출을 허용할 프론트엔드 출처 (쉼표로 구분, 비밀 값 아님)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# 생성 worker: 운영 정책·비밀 설정을 준비한 뒤 명시적으로 활성화
generation.worker.enabled=${GENERATION_WORKER_ENABLED:false}
generation.worker.service-key=${GENERATION_WORKER_SERVICE_KEY:}
generation.worker.gemini-key=${GENERATION_WORKER_GEMINI_KEY:}
generation.worker.model=${GENERATION_WORKER_MODEL:}
generation.worker.poll-interval=${GENERATION_WORKER_POLL_INTERVAL:}
generation.worker.request-timeout=${GENERATION_WORKER_REQUEST_TIMEOUT:}
generation.worker.queued-timeout=${GENERATION_WORKER_QUEUED_TIMEOUT:}
generation.worker.lease-seconds=${GENERATION_WORKER_LEASE_SECONDS:}
generation.worker.max-output-tokens=${GENERATION_WORKER_MAX_OUTPUT_TOKENS:}

# NPC·만료 처리 worker도 운영값을 정한 뒤 활성화
combat.worker.enabled=${COMBAT_WORKER_ENABLED:false}
combat.worker.service-key=${COMBAT_WORKER_SERVICE_KEY:}
combat.worker.poll-interval=${COMBAT_WORKER_POLL_INTERVAL:}
combat.worker.request-timeout=${COMBAT_WORKER_REQUEST_TIMEOUT:}
